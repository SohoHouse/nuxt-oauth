name: CI

on:
  push:
    branches:
      - '**'

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ (github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install
      run: yarn install --frozen-lockfile

    - name: Typecheck
      run: yarn typecheck

    - name: Test
      run: yarn test

    - name: Build
      run: yarn build

    # Consumers' Rollup builds don't transpile node_modules — catch a stray TS construct here.
    - name: Verify build output is plain JS
      shell: bash
      run: |
        shopt -s globstar
        node --check dist/module.mjs
        for f in dist/runtime/**/*.js; do node --check "$f"; done
