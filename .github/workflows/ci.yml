name: CI

on:
  push:
    branches:
      - '**'

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ (github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install
      run: yarn install --frozen-lockfile

    - name: Typecheck
      run: yarn typecheck

    - name: Test
      run: yarn test

    - name: Build
      run: yarn build

    # Consuming apps bundle dist/ with Rollup, which does not apply a
    # TypeScript loader to node_modules — a stray TS construct here only
    # breaks their build, not this one. Catch it before it ships.
    - name: Verify build output is plain JS
      run: |
        shopt -s globstar
        node --check dist/module.mjs
        for f in dist/runtime/**/*.js; do node --check "$f"; done
